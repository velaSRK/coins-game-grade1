<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mauritian Coins Adventure</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:linear-gradient(135deg,#e8f5ff,#fff2f7);font-family:"Comic Sans MS",Arial,sans-serif;color:#222}
.game{max-width:900px;margin:auto;background:#fff;padding:24px;border-radius:22px;box-shadow:0 6px 24px #00000018}
h1{text-align:center;color:#b45b91;margin:4px 0;font-size:clamp(25px,5vw,36px)}
.subtitle{text-align:center;color:#444;margin:8px 0 20px;font-size:18px}
.scorebar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#fff0bd;padding:13px 16px;border-radius:14px;font-weight:bold;font-size:18px}
.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.tab,.mainbtn,.choice{font-family:inherit;font-weight:bold;cursor:pointer;border-radius:13px;padding:12px 18px;font-size:17px}
.tab{border:2px solid #b8a3e8;background:#f5f0ff;color:#222}
.tab.active{background:#7554b5;color:#fff;border-color:#7554b5}
.panel{border:2px solid #c9b8ef;border-radius:18px;padding:20px;text-align:center}
.instruction{font-size:19px;font-weight:bold;color:#245f87;margin:3px 0 18px}
.coin-stage{min-height:190px;display:flex;align-items:center;justify-content:center;gap:15px;flex-wrap:wrap;padding:10px}
.coin-art{display:inline-block;background-image:url("mauritian-coins.png");background-repeat:no-repeat;background-size:605px 537px;background-color:#fff;flex:none}
.coin-art.large{transform:scale(1.18);margin:12px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:15px auto;max-width:620px}
.choice{border:2px solid #9bcff0;background:#eaf7ff;color:#000;min-height:58px}
.choice:hover:not(:disabled){background:#d6efff;transform:translateY(-2px)}
.choice.correct{background:#d9f6e4;border-color:#31a968;color:#000}
.choice.wrong{background:#ffe0e0;border-color:#dc6262;color:#000}
.choice:disabled{opacity:1;cursor:default}
.feedback{min-height:35px;font-weight:bold;font-size:18px;margin:12px 0;color:#222}
.mainbtn{border:0;background:#45bd83;color:white;margin:5px}
.mainbtn.secondary{background:#ffce72;color:#342500}
.mainbtn:disabled{opacity:.5;cursor:default}
.progress{height:12px;background:#eee;border-radius:20px;overflow:hidden;margin:14px 0}
.progress span{display:block;height:100%;width:0;background:#45bd83;transition:width .25s}
.smallnote{font-size:14px;color:#555;margin-top:15px}
.coin-pair{display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap}
.compare-card{border:2px solid #e1d7f5;background:#faf8ff;border-radius:15px;padding:12px;min-width:130px}
.compare-card .coin-art{margin:8px auto}
.compare-card .choice{width:100%;margin-top:8px}
.result{display:none;background:#e0f8e9;border-radius:16px;padding:20px;margin-top:18px}
.result h2{color:#187b49}
@media(max-width:520px){body{padding:8px}.game{padding:13px}.panel{padding:12px}.choices{gap:8px}.choice{font-size:16px;padding:10px 6px}.scorebar{font-size:15px}.coin-stage{min-height:150px}}
</style>
</head>
<body>
<div class="game">
<h1>🪙 Mauritian Coins Adventure</h1>
<p class="subtitle">Learn about the coins we use in Mauritius!</p>

<div class="scorebar">
<span>⭐ Score: <span id="score">0</span></span>
<span>Question: <span id="questionNo">0</span>/<span id="total">7</span></span>
</div>

<div class="tabs">
<button class="tab active" id="identifyTab">1. Name the coin</button>
<button class="tab" id="compareTab">2. Which is worth more?</button>
</div>

<div class="panel">
<div class="instruction" id="instruction">Look carefully at the coin. Choose its value.</div>
<div class="coin-stage" id="coinStage"></div>
<div class="choices" id="choices"></div>
<div class="feedback" id="feedback" aria-live="polite">Choose the correct answer!</div>
<div class="progress"><span id="progressFill"></span></div>
<button class="mainbtn" id="nextBtn" disabled>Next question →</button>
<button class="mainbtn secondary" id="restartBtn">Start again</button>
</div>

<div class="result" id="result">
<h2>🎉 Well done!</h2>
<p id="resultText"></p>
<button class="mainbtn" id="againBtn">Play again</button>
</div>

<p class="smallnote">The coin pictures are taken from the original uploaded image and are not replaced with drawings or emojis.</p>
</div>

<script>
const coins = [
 {id:"5c",label:"5 cents",short:"5c",x:420,y:18,w:125,h:110,value:5,unit:"cents"},
 {id:"20c",label:"20 cents",short:"20c",x:303,y:83,w:140,h:129,value:20,unit:"cents"},
 {id:"50c",label:"50 cents",short:"50c",x:164,y:144,w:159,h:157,value:50,unit:"cents"},
 {id:"1r",label:"1 rupee",short:"Rs 1",x:230,y:296,w:160,h:160,value:1,unit:"rupees"},
 {id:"5r",label:"5 rupees",short:"Rs 5",x:0,y:228,w:193,h:181,value:5,unit:"rupees"},
 {id:"10r",label:"10 rupees",short:"Rs 10",x:382,y:193,w:164,h:157,value:10,unit:"rupees"},
 {id:"20r",label:"20 rupees",short:"Rs 20",x:387,y:358,w:169,h:166,value:20,unit:"rupees"}
];

const stage=document.getElementById("coinStage");
const choices=document.getElementById("choices");
const feedback=document.getElementById("feedback");
const nextBtn=document.getElementById("nextBtn");
const scoreEl=document.getElementById("score");
const questionNo=document.getElementById("questionNo");
const totalEl=document.getElementById("total");
const progressFill=document.getElementById("progressFill");
const result=document.getElementById("result");

let mode="identify",questions=[],index=0,score=0,answered=false;

function shuffle(a){
 const b=[...a];
 for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
 return b;
}
function coinPicture(coin,large=false){
 const el=document.createElement("span");
 el.className="coin-art"+(large?" large":"");
 el.style.width=coin.w+"px";
 el.style.height=coin.h+"px";
 el.style.backgroundPosition=(-coin.x)+"px "+(-coin.y)+"px";
 el.setAttribute("role","img");
 el.setAttribute("aria-label",coin.label+" coin");
 return el;
}
function startGame(newMode=mode){
 mode=newMode;index=0;score=0;answered=false;
 result.style.display="none";
 document.getElementById("identifyTab").classList.toggle("active",mode==="identify");
 document.getElementById("compareTab").classList.toggle("active",mode==="compare");
 if(mode==="identify"){
   questions=shuffle(coins);
   totalEl.textContent=questions.length;
 }else{
   questions=makeComparisons();
   totalEl.textContent=questions.length;
 }
 scoreEl.textContent="0";
 showQuestion();
}
function makeComparisons(){
 const pairs=[
  ["5c","20c"],["20c","50c"],["1r","5r"],["5r","10r"],["10r","20r"],["50c","1r"]
 ];
 return shuffle(pairs).slice(0,5).map(pair=>{
   const a=coins.find(c=>c.id===pair[0]),b=coins.find(c=>c.id===pair[1]);
   return {a,b,answer:a.value>b.value?a.id:b.id};
 });
}
function showQuestion(){
 answered=false;nextBtn.disabled=true;choices.innerHTML="";stage.innerHTML="";
 feedback.textContent="Choose the correct answer!";
 feedback.style.color="#222";
 questionNo.textContent=index+1;
 progressFill.style.width=(index/questions.length*100)+"%";

 if(mode==="identify"){
   const coin=questions[index];
   document.getElementById("instruction").textContent="Look carefully at the coin. Choose its value.";
   stage.appendChild(coinPicture(coin,true));
   const distractors=shuffle(coins.filter(c=>c.id!==coin.id)).slice(0,3);
   const options=shuffle([coin,...distractors]);
   options.forEach(option=>{
     const btn=document.createElement("button");
     btn.className="choice";btn.textContent=option.label;
     btn.addEventListener("click",()=>checkIdentify(btn,option,coin));
     choices.appendChild(btn);
   });
 }else{
   const q=questions[index];
   document.getElementById("instruction").textContent="Which coin is worth MORE?";
   const pair=document.createElement("div");pair.className="coin-pair";
   [q.a,q.b].forEach(c=>{
     const card=document.createElement("div");card.className="compare-card";
     card.appendChild(coinPicture(c));
     const btn=document.createElement("button");btn.className="choice";btn.textContent="Choose this coin";
     btn.addEventListener("click",()=>checkCompare(btn,c,q));
     card.appendChild(btn);pair.appendChild(card);
   });
   stage.appendChild(pair);
 }
}
function checkIdentify(btn,chosen,correct){
 if(answered)return;answered=true;
 const all=[...choices.querySelectorAll("button")];
 all.forEach(b=>{b.disabled=true;if(b.textContent===correct.label)b.classList.add("correct");});
 if(chosen.id===correct.id){score++;feedback.textContent="Correct! Well done!";feedback.style.color="#16834c";}
 else{btn.classList.add("wrong");feedback.textContent="Good try! The correct answer is "+correct.label+".";feedback.style.color="#b33b3b";}
 finishQuestion();
}
function checkCompare(btn,chosen,q){
 if(answered)return;answered=true;
 const all=[...stage.querySelectorAll("button")];
 all.forEach(b=>b.disabled=true);
 if(chosen.id===q.answer){score++;btn.classList.add("correct");feedback.textContent="Correct! That coin is worth more!";feedback.style.color="#16834c";}
 else{
   btn.classList.add("wrong");
   const correctCoin=coins.find(c=>c.id===q.answer);
   const correctCard=[...stage.querySelectorAll(".compare-card")].find(card =>
     card.querySelector(".coin-art").getAttribute("aria-label")===correctCoin.label+" coin"
   );
   if(correctCard)correctCard.querySelector("button").classList.add("correct");
   feedback.textContent="Good try! Look carefully at the coin values.";
   feedback.style.color="#b33b3b";
 }
 finishQuestion();
}
function finishQuestion(){
 scoreEl.textContent=score;
 progressFill.style.width=((index+1)/questions.length*100)+"%";
 nextBtn.disabled=false;
 nextBtn.textContent=index===questions.length-1?"See my score":"Next question →";
}
function nextQuestion(){
 if(!answered)return;
 if(index<questions.length-1){index++;showQuestion();}
 else{
  document.getElementById("resultText").textContent="You scored "+score+" out of "+questions.length+". "+(score===questions.length?"Amazing! You are a Mauritian Coins Champion!":"Great effort! Practise again and become a coin expert!");
  result.style.display="block";
  nextBtn.disabled=true;
  nextBtn.textContent="Game completed";
 }
}
document.getElementById("identifyTab").addEventListener("click",()=>startGame("identify"));
document.getElementById("compareTab").addEventListener("click",()=>startGame("compare"));
document.getElementById("restartBtn").addEventListener("click",()=>startGame(mode));
document.getElementById("againBtn").addEventListener("click",()=>startGame(mode));
nextBtn.addEventListener("click",nextQuestion);
startGame("identify");
</script>
</body>
</html>
